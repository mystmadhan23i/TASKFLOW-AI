# One "colour" of the application. Started as its own project:  COLOR=green APP_VERSION=v2 docker compose -p taskflow-green -f docker-compose.app.yml up -d
services:
  backend:
    build:
      context: ../backend
    image: taskflow-backend:${APP_VERSION:-latest}
    container_name: taskflow-${COLOR:?COLOR must be blue or green}-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taskflow
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ORIGIN: ${APP_PUBLIC_URL:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/uploads
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      APP_COLOR: ${COLOR}
      APP_VERSION: ${APP_VERSION:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads               # shared by both colours
    networks:
      - default
      - data

  web:
    build:
      context: ../frontend
    image: taskflow-web:${APP_VERSION:-latest}
    container_name: taskflow-${COLOR}-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  data:
    name: taskflow-data
    external: true
  edge:
    name: taskflow-edge-net
    external: true

volumes:
  uploads:
    name: taskflow-uploads
    external: true
