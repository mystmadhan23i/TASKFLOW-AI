# Docker's embedded DNS; short TTL so a switch / restart is picked up quickly.
resolver 127.0.0.11 valid=5s ipv6=off;

# Public entrypoint — proxies to whichever colour is currently live.
server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  include /etc/nginx/state/active.conf;   # defines: set $active_upstream taskflow-<colour>-web;

  location = /edge-health { access_log off; default_type text/plain; return 200 "ok\n"; }

  location / {
    proxy_pass http://$active_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_next_upstream error timeout http_502 http_503;
  }
}

# Loopback-only preview of each colour (published as 127.0.0.1:8081). Used for health probes
# of the idle colour BEFORE it receives real traffic:  curl http://127.0.0.1:8081/green/api/health
server {
  listen 8081;
  server_name _;
  location ~ ^/(blue|green)/(.*)$ {
    set $target taskflow-$1-web;
    proxy_pass http://$target/$2$is_args$args;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
  }
}
