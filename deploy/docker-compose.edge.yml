# Shared, long-lived layer: MongoDB + the edge proxy that decides which colour receives traffic.
name: taskflow-edge
services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  edge:
    image: nginx:1.27-alpine
    container_name: taskflow-edge
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-80}:80"              # public entrypoint (serves the LIVE colour)
      - "127.0.0.1:8081:8081"              # loopback-only preview of each colour, used by deploy.sh probes
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./state:/etc/nginx/state:ro        # active.conf is rewritten by deploy.sh / rollback.sh
    networks:
      - edge

networks:
  data:
    name: taskflow-data
  edge:
    name: taskflow-edge-net

volumes:
  mongo-data:
    name: taskflow-mongo-data
